<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramayana AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">A guide to the Valmiki Ramayana</p>
    <h1>Ask Ramayana AI</h1>
    <p class="intro">Explore the story and its characters. Ask in English or Hindi.</p>
    <form id="chatForm">
      <label for="questionInput">Your question</label>
      <textarea id="questionInput" rows="3" maxlength="2000" required placeholder="For example: Why did Rama go into exile?"></textarea>
      <div class="form-row">
        <label for="languageSelect">Answer language</label>
        <select id="languageSelect"><option value="en">English</option><option value="hi">हिन्दी</option></select>
        <button id="askBtn" type="submit">Ask</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="answerContainer" hidden>
      <h2>Answer</h2>
      <p id="answer"></p>
      <audio id="answerAudio" controls hidden></audio>
    </section>
  </main>
  <script src="/static/script.js" defer></script>
</body>
</html>
